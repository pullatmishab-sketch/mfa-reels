name: MFA reels hourly
on:
  schedule: [{cron: '0 * * * *'}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: reels, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-liberation && pip install Pillow
      - run: python run.py
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          POST_URL: ${{ secrets.POST_URL }}
